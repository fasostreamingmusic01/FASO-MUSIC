<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>FASO MUSIC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#14110e;--sf:#211c17;--tx:#f6efe3;--mu:#a99d8c;--rg:#ef2b2d;--vt:#009e49;--jn:#fcd116;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,serif;padding:env(safe-area-inset-top,0) 0 150px;max-width:640px;margin:auto}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--jn);outline-offset:2px}
header{padding:18px 16px 6px;font-size:26px;font-weight:700}
.bande{height:4px;background:linear-gradient(90deg,var(--rg) 0 33%,var(--jn) 33% 66%,var(--vt) 66%)}
h2{font-size:19px;margin:22px 16px 10px}
.note{margin:8px 16px;padding:10px 12px;border-left:3px solid var(--jn);background:var(--sf);font:13px/1.4 system-ui,sans-serif;color:var(--mu)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px}
.card{flex:0 0 130px;text-align:left;font:13px system-ui,sans-serif}.card b{display:block;margin-top:6px;font-weight:600}
.sub,.card span{color:var(--mu);font-size:12px}
.cov{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;background-size:cover;background-position:center}
.art .cov{border-radius:50%}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left;font-family:system-ui,sans-serif}
.row .cov{width:48px;flex:none;font-size:20px}.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.on b{color:var(--jn)}
.ic{font-size:20px;padding:8px;min-width:40px}.fav{color:var(--mu)}.fav.y{color:var(--rg)}.x{color:var(--rg)}
input,select,textarea{background:var(--sf);border:1px solid #3a322a;border-radius:8px;padding:11px;width:calc(100% - 32px);margin:6px 16px;font-family:system-ui,sans-serif}
.btn{background:var(--vt);color:#fff;border-radius:8px;padding:11px 16px;margin:8px 16px;font:600 16px system-ui,sans-serif}.btn.s{background:var(--sf);border:1px solid #3a322a}
.hero{margin:14px 16px;padding:18px;border-radius:10px;background:linear-gradient(135deg,var(--rg),#7a1517);font-size:22px;line-height:1.25}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;background:#0e0c0a;display:flex;border-top:1px solid #3a322a;padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;padding:10px 0;font:12px system-ui,sans-serif;color:var(--mu)}nav button.a{color:var(--jn)}nav i{display:block;font-style:normal;font-size:20px}
#pl{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom,0));left:0;right:0;max-width:640px;margin:auto;background:var(--sf);border-top:2px solid var(--vt);padding:8px 12px;z-index:4;font-family:system-ui,sans-serif}
#pl .top{display:flex;align-items:center;gap:8px}#pl .cov{width:42px;font-size:18px}
#pl input[type=range]{width:100%;margin:4px 0;padding:0;accent-color:var(--jn);background:none;border:0}
.tm{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mu)}.tm input{width:110px;margin:0}
.cov{position:relative;overflow:hidden}.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<header>FASO MUSIC</header><div class="bande"></div>
<main id="v"></main><div id="pl" hidden></div><nav id="nav"></nav>
<script>
/* ===== Connexion à ton serveur Supabase ===== */
const URL_SB="https://oyajnsppykieqhxzinkq.supabase.co";
const CLE_PUBLIQUE="sb_publishable_iEIntgxDvg0AMlLHAMqomg_N0KtxtmB";
const sb=supabase.createClient(URL_SB,CLE_PUBLIQUE);

let S={art:[],ch:[],fav:[],pl:[],user:null,admin:false,page:"accueil",det:null,q:"",info:""};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COUL=["#ef2b2d","#009e49","#c98f00","#7a3fb0","#0f7ea8","#b8451f"];
const col=id=>COUL[Number(id)%COUL.length];
const artiste=id=>S.art.find(a=>a.id==id)||{nom:"Artiste inconnu"};
const titre=id=>S.ch.concat(S.att||[]).find(c=>c.id==id);
const cov=c=>c.pochette_url?`<div class="cov" style="background:${col(c.artiste_id)}"><img src="${esc(c.pochette_url)}" alt="" loading="lazy" decoding="async" crossorigin="anonymous"></div>`:`<div class="cov" style="background:${col(c.artiste_id)}">${esc(c.titre[0])}</div>`;

/* ===== Chargement des données ===== */
async function charge(){
 const [a,c]=await Promise.all([sb.from("artistes").select("*").order("nom"),sb.from("chansons").select("*").order("created_at",{ascending:false})]);
 if(a.error||c.error){try{const k=JSON.parse(localStorage.getItem("fm_cat")||"null");if(k){S.art=k.a;S.ch=k.c;S.info="Mode hors ligne : catalogue enregistré sur votre téléphone."}else S.info="Impossible de charger le catalogue. Vérifiez votre connexion."}catch(e){}}
 if(!(a.error||c.error)){S.art=a.data;S.att=c.data.filter(x=>!pub(x));S.ch=c.data.filter(pub);S.info="";try{localStorage.setItem("fm_cat",JSON.stringify({a:S.art,c:S.ch}))}catch(e){}}
 const{data:{session}}=await sb.auth.getSession();S.user=session?session.user:null;
 if(S.user){const[f,p,ad]=await Promise.all([sb.from("favoris").select("chanson_id"),sb.from("playlists").select("id,nom,playlist_chansons(chanson_id)"),sb.rpc("est_admin")]);
  S.fav=(f.data||[]).map(x=>x.chanson_id);S.pl=p.data||[];S.admin=ad.data===true;if(S.admin){const st=await sb.rpc("stats_ecoutes");S.stats=st.data||[];const cp=await sb.rpc("comptes_artistes");S.cpt=cp.data||[]}const mo=await sb.rpc("mon_artiste");S.mon=mo.data&&mo.data[0]?mo.data[0]:null;S.ms=[];if(S.mon){const ms=await sb.rpc("mes_stats");S.ms=ms.data||[]}const pr=await sb.rpc("prix_ecoute");S.prix=Number(pr.data)||0}
 else{S.fav=[];S.pl=[];S.admin=false;S.mon=null;S.ms=[]}
 rend()}

/* ===== Lecteur audio ===== */
const au=new Audio();au.preload="none";let cur=null,queue=[];
function joue(id,liste){const c=titre(id);if(!c)return;
 if(!c.audio_url){alert("Ce titre n’a pas encore de fichier audio.");return}
 queue=liste||queue;cur=id;ec={id,t:0,last:0,ok:false};au.src=c.audio_url;au.play().catch(()=>alert("Lecture impossible. Vérifiez votre connexion."));if("mediaSession"in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:c.titre,artist:artiste(c.artiste_id).nom,artwork:c.pochette_url?[{src:c.pochette_url}]:[]});navigator.mediaSession.setActionHandler("previoustrack",()=>pas(-1));navigator.mediaSession.setActionHandler("nexttrack",()=>pas(1))}rendPl();rend()}
function bascule(){au.paused?au.play():au.pause()}
function pas(d){const l=queue.filter(i=>titre(i)&&titre(i).audio_url);if(!l.length)return;joue(l[(l.indexOf(cur)+d+l.length)%l.length])}
au.onended=()=>pas(1);au.onplay=au.onpause=()=>rendPl();
au.ontimeupdate=()=>{const g=document.getElementById("pg");if(g&&document.activeElement!==g){g.max=au.duration||0;g.value=au.currentTime}const t=document.getElementById("tc");if(t)t.textContent=mm(au.currentTime)+" / "+mm(au.duration)};
let ec={id:null,t:0,last:0,ok:false};
au.addEventListener("timeupdate",()=>{if(au.paused||cur!==ec.id||ec.ok)return;const d=au.currentTime-ec.last;ec.last=au.currentTime;if(d>0&&d<2)ec.t+=d;if(ec.t>=30){ec.ok=true;compte(cur)}});
function sid(){try{let s=localStorage.getItem("fm_sid");if(!s){s=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();localStorage.setItem("fm_sid",s)}return s}catch(e){return String(Date.now())+Math.random()}}
async function compte(id){try{await sb.rpc("compter_ecoute",{p_chanson:id,p_session:sid()})}catch(e){}}
const mm=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
function rendPl(){const p=document.getElementById("pl"),c=titre(cur);if(!c){p.hidden=true;return}p.hidden=false;
 p.innerHTML=`<div class="top">${cov(c)}<div class="t" style="flex:1;min-width:0"><b>${esc(c.titre)}</b><div class="sub">${esc(artiste(c.artiste_id).nom)}</div></div>
 <button class="ic" aria-label="Précédent" onclick="pas(-1)">⏮</button><button class="ic" aria-label="${au.paused?"Lecture":"Pause"}" onclick="bascule()">${au.paused?"▶":"⏸"}</button><button class="ic" aria-label="Suivant" onclick="pas(1)">⏭</button></div>
 <input type="range" id="pg" min="0" max="${au.duration||0}" step=".1" value="${au.currentTime}" aria-label="Progression" oninput="au.currentTime=this.value">
 <div class="tm"><span id="tc">0:00 / 0:00</span><span>🔊 <input type="range" min="0" max="1" step=".05" value="${au.volume}" aria-label="Volume" oninput="au.volume=this.value"></span></div>`}

/* ===== Interface ===== */
const ONG=[["accueil","⌂","Accueil"],["recherche","⌕","Recherche"],["biblio","♥","Bibliothèque"],["compte","☺","Compte"]];
function aller(p,d){S.page=p;S.det=d||null;rend();scrollTo(0,0)}
const ids=()=>S.ch.map(c=>c.id).join(",");
function ligne(c,l){return `<div class="row ${cur==c.id?"on":""}"><button class="row" style="padding:0;flex:1" onclick="joue(${c.id},[${l}])">${cov(c)}<div class="t"><b>${esc(c.titre)}</b><span class="sub">${esc(artiste(c.artiste_id).nom)}</span></div></button>
 <button class="ic fav ${S.fav.includes(c.id)?"y":""}" aria-label="Favori" onclick="fv(${c.id})">${S.fav.includes(c.id)?"♥":"♡"}</button></div>`}
const carteS=c=>`<button class="card" onclick="joue(${c.id},[${ids()}])">${cov(c)}<b>${esc(c.titre)}</b><span>${esc(artiste(c.artiste_id).nom)}</span></button>`;
const carteA=a=>`<button class="card art" onclick="aller('artiste',${a.id})"><div class="cov" style="background:${col(a.id)}">${esc(a.nom[0])}</div><b>${esc(a.nom)}</b><span>${esc(a.genre||"")}</span></button>`;
const connecte=()=>S.user?true:(alert("Connectez-vous d’abord (onglet Compte)."),false);
async function fv(id){if(!connecte())return;
 if(S.fav.includes(id)){await sb.from("favoris").delete().eq("chanson_id",id);S.fav=S.fav.filter(x=>x!=id)}
 else{await sb.from("favoris").insert({chanson_id:id});S.fav.push(id)}rend()}

function rend(){
 nav.innerHTML=ONG.map(o=>`<button class="${S.page==o[0]?"a":""}" onclick="aller('${o[0]}')"><i>${o[1]}</i>${o[2]}</button>`).join("");
 let h=S.info?`<p class="note">${esc(S.info)}</p>`:"";if(inst)h+=`<button class="btn" onclick="installe()">📲 Installer FASO MUSIC sur mon téléphone</button>`;
 if(S.page=="accueil"){
  h+=`<div class="hero">Écoutez le Faso, où que vous soyez.</div>`+(S.ch.length?`<h2>Nouveautés</h2><div class="rail">${S.ch.slice(0,8).map(carteS).join("")}</div>`:`<p class="note">Aucune chanson pour le moment. Un administrateur peut en ajouter depuis l’onglet Compte.</p>`)+
  `<h2>Artistes</h2><div class="rail">${S.art.map(carteA).join("")}</div>`}
 else if(S.page=="recherche"){h+=`<h2>Rechercher</h2><input id="qi" type="search" placeholder="Chanson ou artiste" value="${esc(S.q)}" oninput="S.q=this.value;rech()"><div id="rl"></div>`}
 else if(S.page=="artiste"){const a=artiste(S.det),l=S.ch.filter(c=>c.artiste_id==S.det);
  h+=`<button class="btn s" onclick="aller('accueil')">‹ Retour</button><div class="hero" style="background:${col(S.det)}">${esc(a.nom)}<div class="sub" style="color:#fff">${esc(a.genre||"")}</div></div><p class="note">${esc(a.bio||"")}</p><h2>Titres</h2>`+(l.map(c=>ligne(c,l.map(x=>x.id))).join("")||`<p class="note">Aucun titre.</p>`)}
 else if(S.page=="biblio"){
  if(!S.user)h+=`<p class="note">Connectez-vous (onglet Compte) pour retrouver vos favoris et vos playlists sur tous vos appareils.</p>`;
  else{const f=S.fav.map(titre).filter(Boolean);
   h+=`<h2>Mes favoris</h2>`+(f.map(c=>ligne(c,f.map(x=>x.id))).join("")||`<p class="note">Touchez ♡ à côté d’un titre.</p>`)+`<h2>Mes playlists</h2>`+
   S.pl.map(p=>{const l=(p.playlist_chansons||[]).map(x=>titre(x.chanson_id)).filter(Boolean);
    return `<h3 style="margin:12px 16px 2px;font-size:16px">${esc(p.nom)} <button class="x" aria-label="Supprimer" onclick="supPl(${p.id})">✕</button></h3>`+l.map(c=>ligne(c,l.map(x=>x.id))).join("")+
    `<select onchange="ajPl(${p.id},this.value)"><option value="">+ Ajouter un titre…</option>${S.ch.map(c=>`<option value="${c.id}">${esc(c.titre)}</option>`).join("")}</select>`}).join("")+
   `<input id="pn" placeholder="Nom de la nouvelle playlist"><button class="btn" onclick="creePl()">Créer la playlist</button>`}}
 else if(S.page=="compte"){
  if(!S.user)h+=`<h2>Connexion</h2><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="mp" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
   <button class="btn" onclick="auth('in')">Se connecter</button><button class="btn s" onclick="auth('up')">Créer un compte</button>`;
  else{h+=`<h2>Mon compte</h2><p class="note">Connecté : ${esc(S.user.email)}${S.admin?" (administrateur)":""}</p><button class="btn s" onclick="sortir()">Se déconnecter</button>${S.mon?`<h2>Espace artiste : ${esc(S.mon.nom)}</h2><p class="note">Total de vos écoutes : ${S.ms.reduce((n,x)=>n+Number(x.total),0)}</p><p class="note">Gains estimés sur 30 jours : <b>${fcfa(S.ms.reduce((n,x)=>n+Number(x.mois),0)*S.prix)}</b> (valeur d’une écoute : ${S.prix} FCFA). Estimation indicative, ce n’est pas un paiement garanti.</p><h2>Proposer une chanson</h2><p class="note">Envoyez uniquement des morceaux dont vous détenez les droits. Chaque chanson est vérifiée avant publication.</p><input id="pt" placeholder="Titre"><input id="pf" type="file" accept="audio/mpeg,audio/mp4,audio/aac"><input id="pcv" type="file" accept="image/*"><button class="btn" id="pb" onclick="propose()">Envoyer pour validation</button>${(S.att||[]).filter(x=>S.mon&&x.artiste_id==S.mon.id).map(x=>`<div class="row"><div class="t"><b>${esc(x.titre)}</b><span class="sub">En attente de validation</span></div></div>`).join("")}${S.ms.map(x=>`<div class="row"><div class="t"><b>${esc(x.titre)}</b><span class="sub">${x.mois} sur 30 j</span></div><b>${x.total}</b></div>`).join("")||`<p class="note">Pas encore de chanson.</p>`}`:""}`;
   if(S.admin)h+=`<h2>Administration</h2>
   <input id="an" placeholder="Nom de l’artiste"><input id="ag" placeholder="Genre"><textarea id="ab" rows="2" placeholder="Biographie"></textarea><button class="btn" onclick="ajA()">Ajouter l’artiste</button>
   <h2>Nouvelle chanson</h2><input id="sn" placeholder="Titre"><select id="sa">${S.art.map(a=>`<option value="${a.id}">${esc(a.nom)}</option>`).join("")}</select>
   <p class="sub" style="margin:6px 16px">Fichier audio (MP3 ou AAC, 15 Mo max). Conseil : MP3 128 kb/s, environ 1 Mo par minute</p><input id="sf" type="file" accept="audio/mpeg,audio/mp4,audio/aac">
   <p class="sub" style="margin:6px 16px">Pochette (image, facultative)</p><input id="sp" type="file" accept="image/*"><button class="btn" id="sb" onclick="ajS()">Publier la chanson</button>
   <h2>À valider (${(S.att||[]).length})</h2>${(S.att||[]).map(x=>`<div class="row"><button class="ic" aria-label="Écouter" onclick="joue(${x.id},[${x.id}])">▶</button><div class="t"><b>${esc(x.titre)}</b><span class="sub">${esc(artiste(x.artiste_id).nom)}</span></div><button class="btn" style="margin:0" onclick="pubS(${x.id})">Publier</button><button class="ic x" aria-label="Refuser" onclick="refS(${x.id})">✕</button></div>`).join("")||`<p class="note">Aucune chanson en attente.</p>`}<h2>Gains estimés</h2><p class="note">Valeur d’une écoute en FCFA. Ce sont des estimations : l’application ne fait aucun paiement.</p><input id="px" type="number" min="0" step="0.5" value="${S.prix||0}"><button class="btn" onclick="fixe()">Enregistrer la valeur d’une écoute</button>${gainsParArtiste()}<h2>Comptes artistes</h2><p class="note">L’artiste crée d’abord un compte (onglet Compte, Créer un compte). Entrez ensuite son email ici.</p><input id="le" type="email" placeholder="Email de l’artiste"><select id="la">${S.art.map(a=>`<option value="${a.id}">${esc(a.nom)}</option>`).join("")}</select><button class="btn" onclick="lie()">Lier ce compte à l’artiste</button>${(S.cpt||[]).map(x=>`<div class="row"><div class="t"><b>${esc(x.email)}</b><span class="sub">${esc(artiste(x.artiste_id).nom)}</span></div></div>`).join("")}<h2>Écoutes</h2><p class="note">Une écoute compte après 30 secondes de lecture, au maximum une fois toutes les 5 minutes par appareil et par chanson. Total : ${(S.stats||[]).reduce((n,x)=>n+Number(x.total),0)}</p>${(S.stats||[]).map(x=>`<div class="row"><div class="t"><b>${esc(x.titre)}</b><span class="sub">${esc(x.artiste)}</span></div><div style="text-align:right"><b>${x.total}</b><div class="sub">${x.mois} sur 30 j</div></div></div>`).join("")}<h2>Gérer</h2>${S.ch.map(c=>`<div class="row"><div class="t"><b>${esc(c.titre)}</b><span class="sub">${esc(artiste(c.artiste_id).nom)}</span></div><button class="ic x" aria-label="Supprimer" onclick="supS(${c.id})">✕</button></div>`).join("")}`}}
 v.innerHTML=h;if(S.page=="recherche")rech()}
function rech(){const q=S.q.toLowerCase(),r=q?S.ch.filter(c=>(c.titre+artiste(c.artiste_id).nom).toLowerCase().includes(q)):[],ra=q?S.art.filter(a=>a.nom.toLowerCase().includes(q)):[];
 rl.innerHTML=q?(ra.length?`<div class="rail" style="margin-top:8px">${ra.map(carteA).join("")}</div>`:"")+(r.map(c=>ligne(c,r.map(x=>x.id))).join("")||(ra.length?"":`<p class="note">Aucun résultat.</p>`)):`<p class="note">Tapez le nom d’une chanson ou d’un artiste.</p>`}

/* ===== Actions : compte, playlists, administration ===== */
async function auth(m){const e=em.value.trim(),p=mp.value;if(!e||p.length<6){alert("Email et mot de passe (6 caractères min.) requis.");return}
 const r=m=="in"?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
 if(r.error){alert("Erreur : "+r.error.message);return}
 if(m=="up"&&!r.data.session){alert("Compte créé. Vérifiez votre boîte mail pour confirmer votre adresse, puis connectez-vous.");return}
 await charge()}
async function sortir(){await sb.auth.signOut();au.pause();cur=null;rendPl();await charge()}
async function creePl(){const n=pn.value.trim();if(!n)return;const r=await sb.from("playlists").insert({nom:n});if(r.error)alert(r.error.message);await charge()}
async function supPl(id){if(confirm("Supprimer cette playlist ?")){await sb.from("playlists").delete().eq("id",id);await charge()}}
async function ajPl(pid,cid){if(!cid)return;const r=await sb.from("playlist_chansons").insert({playlist_id:pid,chanson_id:+cid});if(r.error&&r.error.code!="23505")alert(r.error.message);await charge()}
async function ajA(){const n=an.value.trim();if(!n)return;const r=await sb.from("artistes").insert({nom:n,genre:ag.value.trim(),bio:ab.value.trim()});if(r.error)alert(r.error.message);await charge()}
async function envoi(f,dir){const p=(dir||"")+Date.now()+"-"+f.name.replace(/[^\w.]/g,"_");const r=await sb.storage.from("musique").upload(p,f);if(r.error)throw r.error;return sb.storage.from("musique").getPublicUrl(p).data.publicUrl}
const pub=c=>!c.statut||c.statut=="publie";
async function propose(){const t=pt.value.trim(),f=pf.files[0],c=pcv.files[0];if(!t||!f){alert("Un titre et un fichier audio sont requis.");return}
 const d="soumissions/"+S.user.id+"/";document.getElementById("pb").textContent="Envoi en cours…";
 try{const audio_url=await envoi(f,d),pochette_url=c?await envoi(await redim(c),d):null;
  const r=await sb.from("chansons").insert({titre:t,artiste_id:S.mon.id,audio_url,pochette_url,statut:"en_attente"});if(r.error)throw r.error;alert("Chanson envoyée ! Elle sera visible après validation.")}
 catch(e){alert("Échec : "+e.message)}
 await charge()}
async function pubS(id){const r=await sb.from("chansons").update({statut:"publie"}).eq("id",id);if(r.error)alert(r.error.message);await charge()}

const fcfa=n=>Math.round(n).toLocaleString("fr-FR")+" FCFA";
function gainsParArtiste(){const m={};(S.stats||[]).forEach(x=>{m[x.artiste]=m[x.artiste]||{t:0,n:0};m[x.artiste].t+=Number(x.total);m[x.artiste].n+=Number(x.mois)});return Object.entries(m).map(([a,v])=>`<div class="row"><div class="t"><b>${esc(a)}</b><span class="sub">${v.n} écoutes sur 30 j · total ${v.t}</span></div><b>${fcfa(v.n*S.prix)}</b></div>`).join("")}
async function fixe(){const v=Number(px.value);const r=await sb.rpc("fixer_prix",{p_valeur:v});alert(r.error?r.error.message:(r.data=="ok"?"Enregistré":r.data));await charge()}
async function lie(){const e=le.value.trim();if(!e)return;const r=await sb.rpc("lier_artiste",{p_email:e,p_artiste:+la.value});alert(r.error?r.error.message:(r.data=="ok"?"Compte lié !":r.data));await charge()}
function redim(f){return new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>ok(b?new File([b],"pochette.jpg",{type:"image/jpeg"}):f),"image/jpeg",.8)};i.onerror=()=>ok(f);i.src=URL.createObjectURL(f)})}
async function ajS(){const t=sn.value.trim(),f=sf.files[0],pc=sp.files[0];if(!t||!f){alert("Un titre et un fichier audio sont requis.");return}
 sb.disabled=true;document.getElementById("sb").textContent="Envoi en cours…";
 try{const audio_url=await envoi(f),pochette_url=pc?await envoi(await redim(pc)):null;
  const r=await sb.from("chansons").insert({titre:t,artiste_id:+sa.value,audio_url,pochette_url});if(r.error)throw r.error;alert("Chanson publiée !")}
 catch(e){alert("Échec : "+e.message)}
 await charge()}
async function supS(id){if(confirm("Supprimer cette chanson ?")){const r=await sb.from("chansons").delete().eq("id",id);if(r.error)alert(r.error.message);await charge()}}

rend();charge();
